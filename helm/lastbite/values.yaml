replicas: 2
backend:
  repository: lastbite-backend
  tag: dev
frontend:
  repository: lastbite-frontend
  tag: dev
imagePullPolicy: IfNotPresent
imagePullSecrets: []
database:
  name: lastbite
  user: lastbite
  existingSecret: lastbite-db
  passwordKey: password
  storage: 5Gi
  storageClass: ""
  image: postgres:16-alpine
ingress:
  enabled: false
  className: traefik
  host: lastbite.local
  tls: []
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 60
monitoring:
  enabled: false
  release: monitoring
