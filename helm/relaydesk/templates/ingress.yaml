{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "relaydesk.name" . }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "relaydesk.name" . }}-backend
                port: {number: 8000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "relaydesk.name" . }}-frontend
                port: {number: 8080}
{{- end }}
