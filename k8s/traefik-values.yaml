# A private demo ingress. Port-forward this service to exercise host routing.
service:
  type: ClusterIP
providers:
  kubernetesIngress:
    enabled: true
    # This private demo is reached through localhost port-forwarding on Kind/EKS.
    # Publish that endpoint so Argo CD can assess Ingress health.
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
  kubernetesGateway:
    enabled: false
