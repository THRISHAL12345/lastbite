# One replica of each controller is sufficient for an isolated classroom demo.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
server:
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
