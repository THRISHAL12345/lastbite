# Repository renamed; do not apply before the LastBite commit and images are published.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lastbite
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/THRISHAL12345/lastbite.git
    targetRevision: main
    path: helm/lastbite
    helm:
      releaseName: lastbite
      valueFiles:
        - values-prod.yaml
        - values-release.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: lastbite
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
