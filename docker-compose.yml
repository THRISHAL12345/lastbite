name: lastbite
x-backend: &backend
  build: ./backend
  image: lastbite-backend:dev
  environment: &database
    DB_HOST: postgres
    DB_NAME: lastbite
    DB_USER: lastbite
    DB_PASSWORD: ${POSTGRES_PASSWORD:-lastbite-local-only}
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lastbite
      POSTGRES_USER: lastbite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lastbite-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    <<: *backend
    command: [sh, -c, 'python -m app.wait_db && alembic upgrade head']
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  backend:
    <<: *backend
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  frontend:
    build: ./frontend
    image: lastbite-frontend:dev
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:8080"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  postgres-data:
