# Small ephemeral Kind/CI environment. Production defaults remain separate.
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  create: false
grafana:
  defaultDashboardsEnabled: false
  resources:
    # Grafana 13 exceeds 512Mi when loading the dashboard. At that limit it
    # stalls in memory reclaim and stops serving queries and health checks.
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 768Mi}
