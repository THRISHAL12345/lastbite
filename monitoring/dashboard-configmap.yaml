apiVersion: v1
kind: ConfigMap
metadata:
  name: relaydesk-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  relaydesk.json: |
    {
      "title": "RelayDesk \u00b7 Service health",
      "uid": "relaydesk-health",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "tags": [
        "relaydesk"
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Requests per second",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "expr": "sum(rate(relaydesk_http_requests_total{namespace=\"relaydesk\"}[5m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "P95 response time",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(relaydesk_http_request_duration_seconds_bucket{namespace=\"relaydesk\"}[5m])))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Server error percentage",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "expr": "100 * (sum(rate(relaydesk_http_requests_total{namespace=\"relaydesk\",status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(relaydesk_http_requests_total{namespace=\"relaydesk\"}[5m])), 0.001)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Backend replicas available",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"relaydesk\",deployment=\"relaydesk-backend\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        }
      ]
    }
