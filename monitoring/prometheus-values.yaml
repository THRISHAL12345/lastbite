grafana:
  enabled: true
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
prometheus:
  prometheusSpec:
    retention: 3d
    serviceMonitorSelector:
      matchLabels:
        release: monitoring
    serviceMonitorNamespaceSelector:
      matchNames: [relaydesk, monitoring]
    resources:
      requests: {cpu: 100m, memory: 400Mi}
      limits: {memory: 1Gi}
