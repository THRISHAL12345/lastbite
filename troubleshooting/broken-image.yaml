apiVersion: apps/v1
kind: Deployment
metadata:
  name: lastbite-lab-image
  namespace: lastbite
spec:
  replicas: 1
  selector:
    matchLabels: {app: lastbite-lab-image}
  template:
    metadata:
      labels: {app: lastbite-lab-image}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: lab
          image: ghcr.io/example/lastbite-backend:deliberately-missing
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
